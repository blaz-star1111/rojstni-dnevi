<!DOCTYPE html><html lang="sl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rojstni dnevi</title><style>
:root{--p:#2563eb;--bg:#f6f8fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff;padding:30px 20px}.wrap{max-width:1050px;margin:auto;padding:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 8px 24px #1f293712}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;font:inherit}textarea{min-height:70px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e0e7ff;color:#1e40af}.danger{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}.msg{padding:10px;border-radius:10px;margin-top:12px;background:#f3f4f6}.toolbar{display:flex;gap:10px}.toolbar input{flex:1}.list{display:grid;gap:10px}.person{display:grid;grid-template-columns:1fr auto;gap:10px;border:1px solid var(--line);border-radius:14px;padding:13px}.person h3{margin:0 0 5px}.meta{color:var(--muted);font-size:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.small{font-size:13px;color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:1fr}.person{grid-template-columns:1fr}.toolbar{flex-direction:column}.top{align-items:flex-start;flex-direction:column}}</style></head><body>
<header><div class="wrap"><h1>🎂 Rojstni dnevi</h1><div>Sinhronizacija med telefonom in računalnikom</div></div></header><main class="wrap">
<section id="auth" class="card"><h2>Prijava</h2><div class="grid"><div><label>E-pošta</label><input id="email" type="email"></div><div><label>Geslo</label><input id="password" type="password" minlength="6"></div></div><div class="actions"><button id="login" class="primary">Prijava</button><button id="signup" class="secondary">Ustvari račun</button></div><div id="authMsg" class="msg hidden"></div></section>
<section id="app" class="hidden"><div class="card top"><div><strong id="user"></strong><div class="small">Prijavljen uporabnik</div></div><button id="logout">Odjava</button></div>
<section class="card"><h2>Prenos starega seznama</h2><p>Stari index vsebuje <strong>42 osnovnih vnosov</strong>. Gumb prenese osnovne vnose ter lokalne popravke, dodane in izbrisane vnose iz stare strani.</p><div class="actions"><button id="importLegacy" class="ok">📥 Prenesi stare vnose v Supabase</button></div><div id="importMsg" class="msg hidden"></div></section>
<section class="card"><h2 id="formTitle">Dodaj rojstni dan</h2><form id="form"><input id="editId" type="hidden"><div class="grid"><div><label>Ime in priimek *</label><input id="ime" required></div><div><label>Datum rojstva *</label><input id="datum" type="date" required></div><div><label>Telefon</label><input id="telefon"></div><div><label>Opomba</label><textarea id="opomba"></textarea></div></div><div class="actions"><button class="primary">Shrani</button><button type="button" id="cancel" class="hidden">Prekliči</button></div><div id="formMsg" class="msg hidden"></div></form></section>
<section class="card"><div class="toolbar"><input id="search" placeholder="Išči po imenu ..."><button id="refresh" class="secondary">Osveži</button></div><p id="count" class="small"></p><div id="list" class="list"></div></section></section></main>

const STORAGE_KEY='rojstniDnevi_urejanje_v1'; let rows=[]; const $=x=>document.getElementById(x); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(id,t){$(id).textContent=t;$(id).classList.toggle('hidden',!t)}
function legacyMerged(){let s={overrides:{},added:[],deleted:[]};try{s={...s,...JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}}catch(e){};const base=LEGACY_BASE.filter(r=>!(s.deleted||[]).includes(r.id)).map(r=>({...r,...((s.overrides||{})[r.id]||{})}));return base.concat(s.added||[])}
function iso(r){if(!r.year)return null;return `${String(r.year).padStart(4,'0')}-${String(r.month).padStart(2,'0')}-${String(r.day).padStart(2,'0')}`}
async function load(){const {data,error}=await db.from('rojstni_dnevi').select('*').order('datum_rojstva');if(error){$('list').innerHTML='<div class="msg">'+esc(error.message)+'</div>';return}rows=data||[];render()}
function render(){const q=$('search').value.toLowerCase();const f=rows.filter(r=>(r.ime+' '+(r.priimek||'')+' '+(r.opomba||'')).toLowerCase().includes(q));$('count').textContent='Skupaj v Supabase: '+f.length;$('list').innerHTML=f.map(r=>`<div class="person"><div><h3>${esc(r.ime)} ${esc(r.priimek)}</h3><div class="meta">📅 ${esc(r.datum_rojstva)}${r.telefon?' · 📞 '+esc(r.telefon):''}</div>${r.opomba?'<div class="small">'+esc(r.opomba)+'</div>':''}</div><div class="actions"><button class="secondary" onclick="editRow('${r.id}')">Uredi</button><button class="danger" onclick="delRow('${r.id}')">Izbriši</button></div></div>`).join('')||'<div class="msg">Ni vnosov.</div>'}
$('importLegacy').onclick=async()=>{message('importMsg','Prenašam ...');const {data:{user}}=await db.auth.getUser();const merged=legacyMerged();const payload=merged.filter(r=>iso(r)).map(r=>({user_id:user.id,legacy_id:r.id,ime:r.name,datum_rojstva:iso(r),opomba:r.note||null}));const {error}=await db.from('rojstni_dnevi').upsert(payload,{onConflict:'user_id,legacy_id'});if(error)message('importMsg','Napaka: '+error.message);else{message('importMsg','Uspešno prenesenih oziroma posodobljenih: '+payload.length+' vnosov.');await load()}};

window.editRow=id=>{const r=rows.find(x=>String(x.id)===String(id));$('editId').value=r.id;$('ime').value=(r.ime+' '+(r.priimek||'')).trim();$('datum').value=r.datum_rojstva;$('telefon').value=r.telefon||'';$('opomba').value=r.opomba||'';$('formTitle').textContent='Uredi rojstni dan';$('cancel').classList.remove('hidden')};window.delRow=async id=>{if(confirm('Izbrišem vnos?')){await db.from('rojstni_dnevi').delete().eq('id',id);load()}};

$('login').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)message('authMsg',error.message)};$('signup').onclick=async()=>{const {error}=await db.auth.signUp({email:$('email').value,password:$('password').value});message('authMsg',error?error.message:'Račun ustvarjen. Preveri e-pošto za potrditev.')};$('logout').onclick=()=>db.auth.signOut();
async function session(s){$('auth').classList.toggle('hidden',!!s);$('app').classList.toggle('hidden',!s);if(s){$('user').textContent=s.user.email;load()}}db.auth.onAuthStateChange((e,s)=>session(s));db.auth.getSession().then(({data})=>session(data.session));
</script></body></html>

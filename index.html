<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7c3aed">
  <title>Rojstni dnevi</title>
  <style>
    :root{--p:#7c3aed;--p2:#5b21b6;--bg:#f6f5fb;--card:#fff;--text:#201a2b;--muted:#716a7d;--danger:#dc2626;--line:#e7e2ef;--ok:#15803d}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#f5f3ff,#fff7ed);color:var(--text);min-height:100vh}
    .wrap{max-width:1050px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.hero h1{margin:0;font-size:clamp(28px,5vw,44px)}.hero p{margin:7px 0 0;color:var(--muted)}
    .card{background:rgba(255,255,255,.94);border:1px solid rgba(124,58,237,.12);border-radius:22px;padding:20px;box-shadow:0 16px 45px rgba(60,35,90,.09);margin-bottom:18px}.hidden{display:none!important}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}input,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(124,58,237,.12)}textarea{resize:vertical;min-height:80px}
    button{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer;font:inherit}.primary{background:var(--p);color:#fff}.primary:hover{background:var(--p2)}.secondary{background:#ede9fe;color:var(--p2)}.danger{background:#fee2e2;color:var(--danger)}.ghost{background:#f4f1f8;color:var(--text)}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.status{font-size:13px;color:var(--muted)}.message{padding:11px 13px;border-radius:12px;margin:12px 0;background:#f3e8ff;color:#581c87}.message.error{background:#fee2e2;color:#991b1b}.message.ok{background:#dcfce7;color:#166534}
    .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:15px}.toolbar input{flex:1}.list{display:grid;gap:12px}.person{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:17px;padding:14px;background:#fff}.badge{width:58px;height:58px;border-radius:17px;background:linear-gradient(135deg,#ede9fe,#ffedd5);display:grid;place-items:center;font-weight:900;color:var(--p2);text-align:center;line-height:1.05}.person h3{margin:0 0 5px;font-size:18px}.meta{color:var(--muted);font-size:14px;display:flex;gap:12px;flex-wrap:wrap}.count{font-weight:800;color:var(--p2)}.empty{text-align:center;padding:35px;color:var(--muted)}.small{font-size:12px;color:var(--muted)}
    @media(max-width:700px){.wrap{padding:15px}.hero,.topbar{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.person{grid-template-columns:52px 1fr}.badge{width:50px;height:50px}.person>.actions{grid-column:1/-1}.toolbar{flex-direction:column;align-items:stretch}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero"><div><h1>🎂 Rojstni dnevi</h1><p>Enaki podatki na telefonu in računalniku.</p></div><div id="connection" class="status">Povezovanje …</div></header>

    <section id="authCard" class="card">
      <h2>Prijava</h2>
      <p class="status">Uporabi isti račun na telefonu in računalniku.</p>
      <div class="grid">
        <div><label for="email">E-pošta</label><input id="email" type="email" autocomplete="email" placeholder="ime@primer.si"></div>
        <div><label for="password">Geslo</label><input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="Najmanj 6 znakov"></div>
      </div>
      <div class="actions" style="margin-top:14px"><button class="primary" id="loginBtn">Prijava</button><button class="secondary" id="signupBtn">Ustvari račun</button></div>
      <div id="authMsg" class="message hidden"></div>
    </section>

    <section id="app" class="hidden">
      <div class="card topbar"><div><strong id="userEmail"></strong><div class="small">Sinhronizirano prek Supabase</div></div><button id="logoutBtn" class="ghost">Odjava</button></div>
      <section class="card">
        <h2 id="formTitle">Dodaj rojstni dan</h2>
        <form id="birthdayForm">
          <input id="editId" type="hidden">
          <div class="grid">
            <div><label for="ime">Ime *</label><input id="ime" required maxlength="80"></div>
            <div><label for="priimek">Priimek</label><input id="priimek" maxlength="80"></div>
            <div><label for="datum">Datum rojstva *</label><input id="datum" type="date" required></div>
            <div><label for="telefon">Telefon</label><input id="telefon" type="tel" maxlength="40"></div>
            <div class="full"><label for="opomba">Opomba</label><textarea id="opomba" maxlength="500"></textarea></div>
          </div>
          <div class="actions" style="margin-top:14px"><button class="primary" type="submit">Shrani</button><button class="ghost hidden" type="button" id="cancelEdit">Prekliči urejanje</button></div>
          <div id="formMsg" class="message hidden"></div>
        </form>
      </section>
      <section class="card">
        <div class="toolbar"><input id="search" type="search" placeholder="Išči po imenu, priimku ali opombi …"><button id="refreshBtn" class="secondary">Osveži</button></div>
        <div id="list" class="list"><div class="empty">Nalaganje …</div></div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://knwvdkdisbbxqkahioyj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_nhBPCIRq4E8b5feJ9KJBDQ_OlWeKn3z';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    let records = [];
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function msg(id,text,type=''){const el=$(id);el.textContent=text;el.className='message '+type;el.classList.toggle('hidden',!text)}
    function nextBirthday(dateString){const d=new Date(dateString+'T00:00:00');const now=new Date();let n=new Date(now.getFullYear(),d.getMonth(),d.getDate());if(n<new Date(now.getFullYear(),now.getMonth(),now.getDate()))n.setFullYear(n.getFullYear()+1);return Math.ceil((n-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000)}
    function formatDate(v){return new Intl.DateTimeFormat('sl-SI',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(v+'T00:00:00'))}
    async function showSession(session){const logged=!!session?.user;$('authCard').classList.toggle('hidden',logged);$('app').classList.toggle('hidden',!logged);$('connection').textContent=logged?'● Povezano':'Prijava ni aktivna';if(logged){$('userEmail').textContent=session.user.email;await loadData()}}
    async function loadData(){ $('list').innerHTML='<div class="empty">Nalaganje …</div>';const {data,error}=await db.from('rojstni_dnevi').select('*').order('ime');if(error){$('list').innerHTML='<div class="empty">Napaka: '+esc(error.message)+'</div>';return}records=data||[];render() }
    function render(){const q=$('search').value.trim().toLowerCase();const filtered=records.filter(r=>[r.ime,r.priimek,r.telefon,r.opomba].join(' ').toLowerCase().includes(q)).sort((a,b)=>nextBirthday(a.datum_rojstva)-nextBirthday(b.datum_rojstva));if(!filtered.length){$('list').innerHTML='<div class="empty">Ni vnosov. Dodaj prvi rojstni dan.</div>';return}$('list').innerHTML=filtered.map(r=>{const days=nextBirthday(r.datum_rojstva);return `<article class="person"><div class="badge">${new Date(r.datum_rojstva+'T00:00:00').getDate()}.<br>${new Date(r.datum_rojstva+'T00:00:00').getMonth()+1}.</div><div><h3>${esc(r.ime)} ${esc(r.priimek)}</h3><div class="meta"><span>📅 ${formatDate(r.datum_rojstva)}</span><span class="count">${days===0?'Danes!':days===1?'Jutri':days+' dni'}</span>${r.telefon?`<span>📞 ${esc(r.telefon)}</span>`:''}</div>${r.opomba?`<div class="small" style="margin-top:6px">${esc(r.opomba)}</div>`:''}</div><div class="actions"><button class="secondary" onclick="editRecord('${r.id}')">Uredi</button><button class="danger" onclick="deleteRecord('${r.id}')">Izbriši</button></div></article>`}).join('')}
    window.editRecord=id=>{const r=records.find(x=>String(x.id)===String(id));if(!r)return;$('editId').value=r.id;$('ime').value=r.ime||'';$('priimek').value=r.priimek||'';$('datum').value=r.datum_rojstva||'';$('telefon').value=r.telefon||'';$('opomba').value=r.opomba||'';$('formTitle').textContent='Uredi rojstni dan';$('cancelEdit').classList.remove('hidden');scrollTo({top:250,behavior:'smooth'})};
    window.deleteRecord=async id=>{if(!confirm('Ali želiš izbrisati ta vnos?'))return;const {error}=await db.from('rojstni_dnevi').delete().eq('id',id);if(error)alert(error.message);else await loadData()};
    function resetForm(){$('birthdayForm').reset();$('editId').value='';$('formTitle').textContent='Dodaj rojstni dan';$('cancelEdit').classList.add('hidden');msg('formMsg','')}
    $('birthdayForm').addEventListener('submit',async e=>{e.preventDefault();const {data:{user}}=await db.auth.getUser();if(!user)return;const item={user_id:user.id,ime:$('ime').value.trim(),priimek:$('priimek').value.trim()||null,datum_rojstva:$('datum').value,telefon:$('telefon').value.trim()||null,opomba:$('opomba').value.trim()||null};const id=$('editId').value;const result=id?await db.from('rojstni_dnevi').update(item).eq('id',id):await db.from('rojstni_dnevi').insert(item);if(result.error)msg('formMsg',result.error.message,'error');else{resetForm();await loadData()}});
    $('loginBtn').onclick=async()=>{msg('authMsg','');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)msg('authMsg',error.message,'error')};
    $('signupBtn').onclick=async()=>{msg('authMsg','');const {data,error}=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value});if(error)msg('authMsg',error.message,'error');else msg('authMsg',data.session?'Račun ustvarjen in prijava uspešna.':'Račun je ustvarjen. Preveri potrditveno e-pošto.','ok')};
    $('logoutBtn').onclick=()=>db.auth.signOut();$('cancelEdit').onclick=resetForm;$('refreshBtn').onclick=loadData;$('search').addEventListener('input',render);
    db.auth.onAuthStateChange((_event,session)=>showSession(session));
    db.auth.getSession().then(({data})=>showSession(data.session)).catch(e=>{$('connection').textContent='Napaka povezave';msg('authMsg',e.message,'error')});
  </script>
</body>
</html>
